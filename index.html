<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AV Router — MikroTik</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
</head>
<body>

<div id="login" class="login-overlay hidden">
  <form id="login-form" class="login-card">
    <h1>AV Router</h1>
    <p class="muted">RouterOS credentials</p>
    <label>Username <input id="login-user" autocomplete="username" required></label>
    <label>Password <input id="login-pass" type="password" autocomplete="current-password" required></label>
    <button type="submit">Connect</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">AV<span>Router</span></div>
    <nav id="nav">
      <a href="#/dashboard" data-route="dashboard">Dashboard</a>
      <a href="#/interfaces" data-route="interfaces">Interfaces</a>
      <a href="#/vlans" data-route="vlans">VLANs</a>
      <a href="#/network" data-route="network">IPs &amp; DHCP</a>
      <a href="#/firewall" data-route="firewall">Firewall</a>
      <a href="#/system" data-route="system">System</a>
    </nav>
    <div class="sidebar-footer">
      <div id="identity" class="muted">—</div>
      <button id="logout" class="link-btn">Disconnect</button>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <h2 id="page-title">Dashboard</h2>
      <div class="topbar-right">
        <span id="clock" class="muted"></span>
        <button id="refresh" title="Refresh">⟳</button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="toasts"></div>

<script src="js/api.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
